<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ambunctious Tracker — Debug</title>
  <style>body{font-family:system-ui,Segoe UI,Arial;padding:20px;background:#111;color:#eee} pre{white-space:pre-wrap;background:#000;border-radius:6px;padding:12px;max-height:60vh;overflow:auto}</style>
</head>
<body>
  <h1>Debug helper</h1>
  <p>This lightweight page checks key endpoints and shows results. No secrets are revealed.</p>
  <button id="run">Run checks</button>
  <div id="out"></div>
  <script>
    const out = document.getElementById('out');
    function log(title, v) {
      const el = document.createElement('div');
      el.innerHTML = `<h3>${title}</h3><pre>${typeof v === 'string' ? v : JSON.stringify(v, null, 2)}</pre>`;
      out.appendChild(el);
    }
    async function check(url) {
      try {
        const res = await fetch(url, {method:'GET'});
        const text = await res.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch(e){ parsed = text }
        return {status: res.status, ok: res.ok, body: parsed};
      } catch (e) { return {error: String(e)}; }
    }
    document.getElementById('run').addEventListener('click', async ()=>{
      out.innerHTML = '';
      log('Root HTML', await check('/'));
      log('/api/health', await check('/api/health'));
      log('/api/debug-pin', await check('/api/debug-pin'));
      log('/api/debug-logs', await check('/api/debug-logs'));
      log('/api/debug', await check('/api/debug'));
    });
  </script>
</body>
</html>
